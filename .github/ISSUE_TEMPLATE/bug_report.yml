name: Bug report
description: Report a reproducible failure without sharing private session data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "The extension is currently planned. For prototype failures, say so below. Do not post cookies, signed URLs, private media titles, HAR files or downloaded videos."
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: Browser, operating system, and extension version or prototype commit.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Prefer a synthetic sample. State expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: phase
    attributes:
      label: Failure phase and redacted evidence
      description: Discovery, downloading, recovery, assembly, or final save. Remove credentials and private URLs.
    validations:
      required: true
