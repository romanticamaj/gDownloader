name: Feature request
description: Describe a download use case or usability improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: use-case
    attributes:
      label: User need
      description: What are you trying to achieve, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed behavior
      description: Describe inputs, expected output and recovery needs; avoid private source URLs.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproducible example or alternatives
      description: Synthetic fixtures, public API documentation or a sketch are welcome.
